# Cluster role for the operator itself.
# TODO: A lot of these should be replaced by roles in the namespaces for which
# the operator actually needs access.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: openshift-ingress-operator
  annotations:
    capability.openshift.io/name: Ingress
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - serviceaccounts
  - endpoints
  - services
  - secrets
  - pods
  - events
  verbs:
  - "*"

- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - "create"

- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list

- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  verbs:
  - "*"

- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - "*"

- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - create
  - get
  - update

- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  - roles
  - rolebindings
  verbs:
  - create
  - get
  - list
  - watch
  - update

- apiGroups:
  - operator.openshift.io
  resources:
  - ingresscontrollers
  - ingresscontrollers/status
  verbs:
  - "*"

- apiGroups:
  - operator.openshift.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - operator.openshift.io
  resources:
  - ingresses/status
  verbs:
  - get
  - update
  - patch

- apiGroups:
  - ingress.operator.openshift.io
  resources:
  - dnsrecords
  - dnsrecords/status
  verbs:
  - "*"

- apiGroups:
  - config.openshift.io
  resources:
  - infrastructures
  - ingresses
  - dnses
  - featuregates
  - apiservers
  - networks
  - clusterversions
  - proxies
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - config.openshift.io
  resources:
  - dnses
  - featuregates
  - infrastructures
  - ingresses
  verbs:
  - list
  - watch

- apiGroups:
  - config.openshift.io
  resources:
  - infrastructures/status
  verbs:
  - update

- apiGroups:
  - config.openshift.io
  resources:
  - clusteroperators
  verbs:
  - create
  - get
  - list
  - watch

- apiGroups:
  - config.openshift.io
  resources:
  - clusteroperators/status
  verbs:
  - update

- apiGroups:
  - config.openshift.io
  resources:
  - ingresses/status
  verbs:
  - patch

- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - '*'

- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - create
  - update
  - watch
  - delete

- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  - gatewayclasses/status
  - gateways
  - httproutes
  - grpcroutes
  - referencegrants
  - backendtlspolicies
  - listenersets
  - listenersets/status
  verbs:
  - '*'

- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways/status
  verbs:
  - patch
  - update

# The gatewayapi controller watches ValidatingAdmissionPolicies and their
# bindings (list/watch, used by the informer) and creates the managed
# policy/binding. RBAC does not support resourceNames on create/list/watch,
# so these remain cluster-wide.
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - create
  - list
  - watch
# Reads and mutations of the managed policy/binding are scoped by name to
# the single CIO-managed ValidatingAdmissionPolicy (and its identically
# named binding), so the operator cannot get/update/delete any other VAP.
# Reads are cache-served, so get is never a live API call; it is scoped
# here for defense in depth.
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  resourceNames:
  - openshift-ingress-operator-gatewayapi-crd-admission
  verbs:
  - delete
  - get
  - update

- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - create
  - get
  - list
  - update
  - watch

- apiGroups:
  - operators.coreos.com
  resources:
  - subscriptions
  - installplans
  verbs:
  - '*'

- apiGroups:
  - sailoperator.io
  resources:
  - istios
  - istiorevisions
  verbs:
  - '*'

# Mirrored from assets/router/metrics/cluster-role.yaml
- apiGroups:
  - route.openshift.io
  resources:
  - routers/metrics
  verbs:
  - get

# Mirrored from assets/router/cluster-role.yaml
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create

# Mirrored from assets/router/cluster-role.yaml
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create

# Mirrored from assets/router/cluster-role.yaml
# and expanded for the canary-controller.
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  - routes/custom-host
  verbs:
  - '*'

# Mirrored from assets/router/cluster-role.yaml
- apiGroups:
  - route.openshift.io
  resources:
  - routes/status
  verbs:
  - update

# Mirrored from assets/router/cluster-role.yaml
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  verbs:
  - use
  resourceNames:
  - hostnetwork
  - restricted

# Mirrored from assets/router/cluster-role.yaml
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
  - watch
